<!DOCTYPE html>
<html>
<head>
    <title>Admin - User Ratings</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            margin: 40px auto;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e6e6e6;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);

            /* ✅ smooth animation */
            transition: all 0.3s ease;
            cursor: pointer;
        }

        /* ⭐ hover effect (card moves up) */
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        .row {
            margin-bottom: 10px;
            font-size: 14px;
        }

        .label {
            font-weight: bold;
            width: 110px;
            display: inline-block;
            color: #34495e;
        }

        .value {
            color: #555;
        }

        .stars {
            color: #f1c40f;
            font-size: 18px;
        }

        .empty {
            text-align: center;
            color: gray;
            margin-top: 50px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>User Ratings (Admin Panel)</h2>

    {% if ratings %}
        {% for r in ratings %}
            <div class="card">

                <div class="row">
                    <span class="label">Username:</span>
                    <span class="value">{{ r.user_name }}</span>
                </div>

                <div class="row">
                    <span class="label">Rating:</span>
                    <span class="value stars">
                        {% for i in range(r.rating) %}
                            ★
                        {% endfor %}
                        {% for i in range(5 - r.rating) %}
                            ☆
                        {% endfor %}
                    </span>
                </div>

                <div class="row">
                    <span class="label">Feedback:</span>
                    <span class="value">{{ r.feedback }}</span>
                </div>

            </div>
        {% endfor %}
    {% else %}
        <p class="empty">No ratings available.</p>
    {% endif %}

</div>

</body>
</html>
