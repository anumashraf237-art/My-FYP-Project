<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doctor Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(-45deg, #0b3324, #1a5e3f, #2b7a56, #13402b);
  background-size: 400% 400%;
  animation: gradientBG 10s ease infinite;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
}

@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.login-card {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(12px);
  padding: 40px;
  border-radius: 20px;
  width: 380px;
  box-shadow: 0 15px 30px rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.2);
}

.login-title {
  text-align: center;
  margin-bottom: 25px;
  font-weight: 700;
}

.form-control {
  border-radius: 10px;
  border: none;
  padding: 12px;
}

.login-btn {
  background: #ffc107;
  font-weight: 600;
  padding: 10px;
  border-radius: 30px;
  transition: 0.3s;
  color: white;
}

.login-btn:hover {
  background: #3a5a40;
  transform: translateY(-2px);
}

.flash-container {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
}

.flash-message {
  padding: 15px 25px;
  border-radius: 8px;
  color: white;
  font-weight: bold;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  animation: fadeOut 4s forwards;
}

.flash-message.danger {
  background: #f1132a;  /* RED */
}

.flash-message.success {
  background: #28a745;  /* GREEN - only for success */
}

@keyframes fadeOut {
  0% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; display: none; }
}
</style>

</head>
<body>

<!-- Showing RED error message as requested -->
<div class="flash-container">
  <div class="flash-message danger">
    Invalid credentials. 
  </div>
</div>

<div class="login-card">
  <h2 class="login-title">Doctor Login</h2>

  <form method="POST">
    <div class="mb-3">
      <label>Email</label>
      <input type="email" class="form-control" name="email" value="admin@doctorhub.com" required>
    </div>

    <div class="mb-3">
      <label>Password</label>
      <input type="password" class="form-control" name="password" value="12345678" required>
    </div>

    <button type="submit" class="btn login-btn w-100">
      Login
    </button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
