<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Role - Doctor Appointment Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: linear-gradient(-45deg, #0b3324, #1a5e3f, #2b7a56, #13402b);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating particles background effect */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: rgba(240, 173, 78, 0.15);
            border-radius: 50%;
            animation: float 8s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0.2;
            }
            25% {
                transform: translateY(-40px) translateX(20px) scale(1.2);
                opacity: 0.4;
            }
            50% {
                transform: translateY(-80px) translateX(-10px) scale(0.8);
                opacity: 0.6;
            }
            75% {
                transform: translateY(-40px) translateX(-25px) scale(1.1);
                opacity: 0.3;
            }
        }

        .title {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 60px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
            animation: fadeInDown 1s ease;
            position: relative;
            z-index: 1;
            letter-spacing: 1px;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title span {
            color: #f0ad4e;
        }

        .container {
            display: flex;
            gap: 70px;
            flex-wrap: wrap;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .card {
            width: 240px;
            height: 240px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), inset 0 0 20px rgba(255, 255, 255, 0.05);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            animation: fadeInUp 0.8s ease backwards;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(240, 173, 78, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .card:nth-child(1) {
            animation-delay: 0.2s;
        }

        .card:nth-child(2) {
            animation-delay: 0.4s;
        }

        .card:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card:hover {
            transform: translateY(-15px) scale(1.08);
            background: rgba(255, 255, 255, 0.18);
            border-color: #f0ad4e;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), 0 0 40px rgba(240, 173, 78, 0.2);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card i {
            font-size: 55px;
            margin-bottom: 20px;
            color: #f0ad4e;
            transition: all 0.4s ease;
            position: relative;
            z-index: 1;
        }

        .card:hover i {
            transform: scale(1.2);
            text-shadow: 0 0 20px rgba(240, 173, 78, 0.5);
        }

        .card h2 {
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 1.4rem;
            position: relative;
            z-index: 1;
        }

        .card a {
            text-decoration: none;
            background: #f0ad4e;
            padding: 10px 25px;
            border-radius: 25px;
            color: #222;
            font-weight: 600;
            transition: all 0.4s ease;
            position: relative;
            z-index: 1;
            letter-spacing: 0.5px;
        }

        .card a:hover {
            background: white;
            transform: translateY(-3px);
            color: #1a5d2c;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .back-btn {
            margin-top: 60px;
            text-decoration: none;
            background: transparent;
            border: 2px solid #f0ad4e;
            padding: 12px 35px;
            border-radius: 30px;
            color: #f0ad4e;
            font-weight: 600;
            transition: all 0.4s ease;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.8s ease 0.8s backwards;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
        }

        .back-btn:hover {
            background: #f0ad4e;
            color: #222;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(240, 173, 78, 0.3);
        }

        .back-btn i {
            transition: transform 0.3s ease;
        }

        .back-btn:hover i {
            transform: translateX(-5px);
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .title {
                font-size: 2.5rem;
                margin-bottom: 50px;
            }
            .container {
                gap: 40px;
            }
            .card {
                width: 200px;
                height: 200px;
            }
            .card i {
                font-size: 45px;
            }
            .card h2 {
                font-size: 1.2rem;
            }
            .card a {
                padding: 8px 20px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 700px) {
            .title {
                font-size: 2rem;
                margin-bottom: 40px;
                text-align: center;
                padding: 0 20px;
            }
            .container {
                gap: 25px;
                flex-direction: column;
                align-items: center;
            }
            .card {
                width: 170px;
                height: 170px;
            }
            .card i {
                font-size: 38px;
                margin-bottom: 12px;
            }
            .card h2 {
                font-size: 1.1rem;
                margin-bottom: 12px;
            }
            .card a {
                padding: 6px 16px;
                font-size: 0.8rem;
            }
            .back-btn {
                margin-top: 40px;
                padding: 10px 25px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 400px) {
            .title {
                font-size: 1.6rem;
            }
            .container {
                gap: 20px;
            }
            .card {
                width: 140px;
                height: 140px;
            }
            .card i {
                font-size: 30px;
            }
            .card h2 {
                font-size: 1rem;
                margin-bottom: 8px;
            }
            .card a {
                padding: 5px 12px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <!-- Floating Background Particles -->
    <div class="particles">
        <div class="particle" style="width: 8px; height: 8px; top: 10%; left: 10%; animation-delay: 0s;"></div>
        <div class="particle" style="width: 12px; height: 12px; top: 20%; left: 80%; animation-delay: 1s;"></div>
        <div class="particle" style="width: 6px; height: 6px; top: 50%; left: 15%; animation-delay: 2s;"></div>
        <div class="particle" style="width: 10px; height: 10px; top: 70%; left: 70%; animation-delay: 3s;"></div>
        <div class="particle" style="width: 7px; height: 7px; top: 30%; left: 40%; animation-delay: 4s;"></div>
        <div class="particle" style="width: 15px; height: 15px; top: 80%; left: 25%; animation-delay: 5s;"></div>
        <div class="particle" style="width: 5px; height: 5px; top: 60%; left: 55%; animation-delay: 6s;"></div>
        <div class="particle" style="width: 9px; height: 9px; top: 15%; left: 60%; animation-delay: 7s;"></div>
        <div class="particle" style="width: 11px; height: 11px; top: 45%; left: 90%; animation-delay: 2.5s;"></div>
        <div class="particle" style="width: 6px; height: 6px; top: 90%; left: 45%; animation-delay: 5.5s;"></div>
    </div>

    <!-- Main Title -->
    <h1 class="title">Select <span>Your Role</span></h1>

    <!-- Role Cards -->
    <div class="container">
        <!-- User Card -->
        <div class="card">
            <i class="fas fa-user"></i>
            <h2>User</h2>
            <a href="{{ url_for('login') }}">Login</a>
        </div>

        <!-- Doctor Card -->
        <div class="card">
            <i class="fas fa-user-md"></i>
            <h2>Doctor</h2>
            <a href="{{ url_for('doctor_login') }}">Login</a>
        </div>

        <!-- Admin Card -->
        <div class="card">
            <i class="fas fa-user-shield"></i>
            <h2>Admin</h2>
            <a href="{{ url_for('admin_login') }}">Login</a>
        </div>
    </div>

    <!-- Back Button -->
    <a href="{{ url_for('welcome') }}" class="back-btn">
        <i class="fas fa-arrow-left"></i> Back
    </a>

    <script>
        // Add hover sound effect (optional)
        const cards = document.querySelectorAll('.card');
        
        cards.forEach(card => {
            card.addEventListener('mouseenter', function() {
                // You can add sound effect here if needed
                // const audio = new Audio('/static/hover.mp3');
                // audio.play();
            });
        });

        // Add click ripple effect
        cards.forEach(card => {
            card.addEventListener('click', function(e) {
                e.preventDefault();
                
                // Create ripple
                const ripple = document.createElement('div');
                ripple.style.cssText = `
                    position: absolute;
                    width: 20px;
                    height: 20px;
                    background: rgba(240, 173, 78, 0.5);
                    border-radius: 50%;
                    pointer-events: none;
                    animation: rippleEffect 0.8s ease-out;
                    top: ${e.clientY - this.getBoundingClientRect().top - 10}px;
                    left: ${e.clientX - this.getBoundingClientRect().left - 10}px;
                `;
                
                this.appendChild(ripple);
                
                // Navigate after animation
                setTimeout(() => {
                    const link = this.querySelector('a');
                    if (link) {
                        window.location.href = link.getAttribute('href');
                    }
                }, 400);
                
                // Remove ripple after animation
                setTimeout(() => {
                    ripple.remove();
                }, 800);
            });
        });

        // Add ripple animation style
        const style = document.createElement('style');
        style.textContent = `
            @keyframes rippleEffect {
                to {
                    width: 300px;
                    height: 300px;
                    opacity: 0;
                    margin-top: -140px;
                    margin-left: -140px;
                }
            }
        `;
        document.head.appendChild(style);

        // Smooth scroll reveal animation
        document.addEventListener('DOMContentLoaded', function() {
            // Page is ready
            console.log('Actor selection page loaded successfully');
        });

        // Handle keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                // Go back on Escape key
                const backBtn = document.querySelector('.back-btn');
                if (backBtn) {
                    window.location.href = backBtn.getAttribute('href');
                }
            }
        });
    </script>

</body>
</html>
