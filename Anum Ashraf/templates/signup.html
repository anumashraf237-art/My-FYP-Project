<!DOCTYPE html>
<html>
<head>
<title>Signup</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1f3b32, #285943);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    background: white;
    padding: 30px;
    width: 400px;
    border-radius: 10px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.2);
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

.form-group {
    margin-bottom: 15px;
}

label {
    font-weight: bold;
}

input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    margin-top: 5px;
}

button {
    width: 100%;
    padding: 12px;
    background: #1f7a63;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #145a47;
}

small {
    color: red;
}

.alert {
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 5px;
    text-align: center;
    color: white;
}

.alert.success { background: #28a745; }
.alert.error { background: #dc3545; }

.info-text {
    font-size: 13px;
    margin-top: 5px;
}

.info-text span {
    display: block;
    color: #666;
}
.info-text span.valid {
    color: green;
}
</style>
</head>

<body>

<div class="container">

<h2>Create Account</h2>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
    {% for category, message in messages %}
        <div class="alert {{ category }}">{{ message }}</div>
    {% endfor %}
{% endif %}
{% endwith %}

<form method="POST" id="signupForm">

    <div class="form-group">
        <label>First Name</label>
        <input type="text" name="first_name" required autocomplete="given-name">
    </div>

    <div class="form-group">
        <label>Last Name</label>
        <input type="text" name="last_name" required autocomplete="family-name">
    </div>

    <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required autocomplete="email">
    </div>

    <div class="form-group">
        <label>Phone</label>
        <input type="tel" name="phone" required autocomplete="tel">
    </div>

    <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" name="dob" id="dob" required>
        <small id="dobError"></small>
    </div>

    <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" name="password" required autocomplete="new-password">
        <small id="passError"></small>
        <div class="info-text">
            <span id="ruleLength">• At least 8 characters</span>
        </div>
    </div>

    <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password">
        <small id="confirmError"></small>
    </div>

    <button type="submit">Create Account</button>

</form>

</div>

<script>
// Password rule elements
let password = document.getElementById("password");
let confirm = document.getElementById("confirm_password");
let dob = document.getElementById("dob");

let passError = document.getElementById("passError");
let confirmError = document.getElementById("confirmError");
let dobError = document.getElementById("dobError");

let ruleLength = document.getElementById("ruleLength");

// Set max date for DOB input (15 years ago from today)
let today = new Date();
let year = today.getFullYear() - 15;
let month = ("0" + (today.getMonth() + 1)).slice(-2);
let day = ("0" + today.getDate()).slice(-2);
dob.max = `${year}-${month}-${day}`;

// Live password feedback (only length)
password.addEventListener("input", function(){
    let value = password.value;
    ruleLength.classList.toggle("valid", value.length >= 8);
});

document.getElementById("signupForm").addEventListener("submit", function(e){
    let value = password.value;

    passError.innerText = "";
    confirmError.innerText = "";
    dobError.innerText = "";

    let valid = true;

    // Password validation (only length)
    if(value.length < 8){
        passError.innerText = "Password must be at least 8 characters";
        valid = false;
    }

    // Confirm password
    if(confirm.value !== value){
        confirmError.innerText = "Passwords do not match";
        valid = false;
    }

    // DOB validation (minimum 15 years)
    if(dob.value){
        let birthDate = new Date(dob.value);
        let today = new Date();
        let age = today.getFullYear() - birthDate.getFullYear();
        let m = today.getMonth() - birthDate.getMonth();
        if(m < 0 || (m === 0 && today.getDate() < birthDate.getDate())){
            age--;
        }
        if(age < 15){
            dobError.innerText = "You must be at least 15 years old!";
            valid = false;
        }
    }

    if(!valid){
        e.preventDefault();
    }
});
</script>

</body>
</html>
