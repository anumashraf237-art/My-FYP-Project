<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | Update Your Information</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2f5d50 0%, #6b8f71 100%);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 550px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2f5d50 0%, #6b8f71 100%);
            padding: 30px;
            text-align: center;
        }

        .header h2 {
            color: white;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            color: rgba(255,255,255,0.9);
            font-size: 14px;
        }

        .form-content {
            padding: 35px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #2f5d50;
            box-shadow: 0 0 0 3px rgba(47,93,80,0.15);
        }

        hr {
            margin: 25px 0;
            border: none;
            height: 1px;
            background: #e0e0e0;
        }

        .password-section h3 {
            margin-bottom: 15px;
            font-size: 18px;
            color: #333;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2f5d50 0%, #6b8f71 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* popup */
        #popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .popup-box {
            background: white;
            padding: 30px 50px;
            border-radius: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            color: #2f5d50;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h2>✏️ Edit Profile</h2>
        <p>Update your personal information</p>
    </div>

    <div class="form-content">

        {% if error_message %}
        <div class="error-message">
            ⚠️ {{ error_message }}
        </div>
        {% endif %}

        {% if update_success %}
        <div id="popup">
            <div class="popup-box">
                Profile Updated Successfully!
            </div>
        </div>

        <script>
            setTimeout(() => {
                window.location.href = "{{ url_for('home') }}";
            }, 2000);
        </script>
        {% endif %}

        <form method="POST">

            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="first_name"
                    value="{{ user.first_name if user else '' }}" required>
            </div>

            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="last_name"
                    value="{{ user.last_name if user else '' }}" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email"
                    value="{{ user.email if user else '' }}" required>
            </div>

            <hr>

            <div class="password-section">
                <h3>Change Password</h3>

                <div class="form-group">
                    <label>Current Password</label>
                    <input type="password"
                           name="current_password"
                           id="current_password"
                           placeholder="Enter current password"
                           required
                           onfocus="showPassword(this)"
                           onblur="hidePassword(this)">
                </div>

                <div class="form-group">
                    <label>New Password (optional)</label>
                    <input type="password"
                           name="new_password"
                           placeholder="Leave blank to keep current password">
                </div>
            </div>

            <button type="submit">💾 Update Profile</button>
        </form>

    </div>
</div>

<script>
function showPassword(input) {
    input.type = "text";
}

function hidePassword(input) {
    input.type = "password";
}
</script>

</body>
</html>
