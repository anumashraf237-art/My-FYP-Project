<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Appointment Hub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root {
    --forest: #1a5d2c;
    --deep-sage: #2d8a4c;
    --amber: #f0ad4e;
    --light-gray: #f7f7f7;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: linear-gradient(-45deg, #0b3324, #1a5e3f, #2b7a56, #13402b);
    background-size: 400% 400%;
    animation: gradientBG 12s ease infinite;
    color: white;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* HERO */
.hero-section {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
}

.hero-title {
    font-size: 3.8rem;
    font-weight: 800;
    margin-bottom: 20px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
}

.hero-title span {
    color: var(--amber);
}

.hero-sub {
    font-size: 1.3rem;
    margin-bottom: 40px;
    color: rgba(255,255,255,0.9);
}

/* BUTTON */
.btn-start {
    display: inline-block;
    padding: 15px 55px;
    font-size: 1.4rem;
    font-weight: 600;
    border-radius: 60px;
    text-decoration: none;
    color: #1e2a1e;
    background: var(--amber);
    transition: 0.3s;
    box-shadow: 0 15px 25px rgba(0,0,0,0.3);
}

.btn-start:hover {
    background: white;
    transform: translateY(-5px);
    color: var(--forest);
}

/* FOOTER */
.site-footer {
    text-align: center;
    padding: 20px;
    background: rgba(0,0,0,0.35);
    font-size: 0.9rem;
    color: #ddd;
}

@media (max-width: 768px) {
    .hero-title {
        font-size: 2.6rem;
    }
    .hero-sub {
        font-size: 1.1rem;
    }
    .btn-start {
        padding: 12px 40px;
        font-size: 1.2rem;
    }
}
</style>
</head>
<body>

<!-- HERO SECTION -->
<section class="hero-section">
    <div>
        <h1 class="hero-title">
            DOCTOR APPOINTMENT <span>HUB</span>
        </h1>
        <p class="hero-sub">
            Book appointments and consult top doctors easily.
        </p>
        <a href="{{ url_for('actor') }}" class="btn-start">
            GET STARTED <i class="fas fa-arrow-right ms-2"></i>
        </a>
    </div>
</section>

<!-- FOOTER -->
<footer class="site-footer">
    © 2025 Doctor Appointment Hub — All rights reserved.
</footer>

</body>
</html>
