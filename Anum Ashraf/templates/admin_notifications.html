<!DOCTYPE html>
<html>
<head>
    <title>Admin Notifications</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            margin: 40px auto;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
        }

        .card {
            background: white;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.08);
            border-left: 5px solid #3498db;
        }

        .row {
            margin: 5px 0;
            font-size: 14px;
        }

        .label {
            font-weight: bold;
            color: #2c3e50;
            width: 120px;
            display: inline-block;
        }

        .status {
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 12px;
            color: white;
        }

        .Sent { background: #27ae60; }
        .Pending { background: #f39c12; }
        .Failed { background: #e74c3c; }

        .empty {
            text-align: center;
            color: gray;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>🔔 Admin Notifications</h2>

    {% if notifications %}
        {% for n in notifications %}
            <div class="card">

                <div class="row">
                    <span class="label">Email:</span> {{ n.user_email }}
                </div>

                <div class="row">
                    <span class="label">Type:</span> {{ n.type }}
                </div>

                <div class="row">
                    <span class="label">Subject:</span> {{ n.subject }}
                </div>

                <div class="row">
                    <span class="label">Message:</span> {{ n.message }}
                </div>

                <div class="row">
                    <span class="label">Status:</span> 
                    <span class="status {{ n.status }}">{{ n.status }}</span>
                </div>

                <div class="row">
                    <span class="label">Time:</span> {{ n.sent_at }}
                </div>

            </div>
        {% endfor %}
    {% else %}
        <p class="empty">No notifications available</p>
    {% endif %}

</div>

</body>
</html>
